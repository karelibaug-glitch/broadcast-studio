name: Build Android APK (USB Capture & WebRTC)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: node build-www.js

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Permissions and WebRTC Bridge
        run: node patch-android.js

      - name: Grant Gradle Execution Permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Broadcast-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
