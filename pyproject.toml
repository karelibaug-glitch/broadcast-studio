[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "broadcast-studio"
version = "1.0.0"
description = "Pro Broadcast Studio Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0"
]

[tool.setuptools]
packages = ["python_app"]
py-modules = ["main"]

[tool.vercel]
entrypoint = "main.py"
